name: Pleos emulator experiment (silent)

on:
  workflow_dispatch:
    inputs:
      acknowledge_pleos_license:
        description: 'I reviewed/accept Pleos SDK license 2.1/2.2 linked in android/EMULATOR.md; installation/use accepts it.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pleos-emulator-experiment
  cancel-in-progress: false

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EVIDENCE: ${{ github.workspace }}/pleos-evidence
      APP_ID: ai.projectshu.musicdiary.pleosdemo
      PLEOS_IMAGE: system-images;android-34;pleos_car_emulator;x86_64
      PLEOS_REPOSITORY: https://nexus-playground.pleos.ai/repository/raw-releases/connect-avd/2.x/crp-sys-img.xml
    steps:
      - name: Require explicit license acknowledgement before any installation
        env:
          ACKNOWLEDGED: ${{ inputs.acknowledge_pleos_license }}
        run: |
          if [ "$ACKNOWLEDGED" != true ]; then
            echo '::error::Not started. Review Pleos SDK license clauses 2.1/2.2 in pleos-demo/android/EMULATOR.md and explicitly acknowledge before installation.'
            echo 'No Pleos SDK or emulator installation was attempted.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Experimental software-rendered Pleos boot. No guarantee of GPU compatibility; no release or vehicle certification.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Prepare evidence and record revision
        id: prepare
        run: |
          mkdir -p "$EVIDENCE"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/pleos-avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pleos-avd"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE/commit.txt"
          df -h > "$EVIDENCE/disk-before.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Prepare Linux emulator runtime before downloading Pleos image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          sdkmanager emulator > "$EVIDENCE/google-emulator-install.log" 2>&1
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          # The launcher sets paths for bundled Qt/libc++/emulator libraries.
          # Raw qemu ldd does not reproduce that environment: diagnostic only.
          ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64" > "$EVIDENCE/emulator-linked-libraries.txt" 2>&1 || true
          if ! "$ANDROID_HOME/emulator/emulator" -version > "$EVIDENCE/emulator-version.txt" 2>&1; then
            cat "$EVIDENCE/emulator-version.txt"
            echo '::error::Google emulator runtime check failed before Pleos image download.'
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Compile this revision against the official SDK
        working-directory: pleos-demo/android
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee "$EVIDENCE/build.log"
      - name: Register official image repository and inspect metadata
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, xml.etree.ElementTree as ET
          url = os.environ['PLEOS_REPOSITORY']
          with urllib.request.urlopen(url, timeout=30) as response:
              root = ET.fromstring(response.read(262144))
          package = next(e for e in root.iter() if e.tag.split('}')[-1] == 'remotePackage' and e.get('path') == os.environ['PLEOS_IMAGE'])
          def value(name):
              return next((e.text or '').strip() for e in package.iter() if e.tag.split('}')[-1] == name)
          result = {'repository': url, 'package': package.get('path'), 'api': value('api-level'), 'abi': value('abi'), 'archive': value('url'), 'archiveBytes': int(value('size')), 'checksum': value('checksum')}
          assert result['api'] == '34' and result['abi'] == 'x86_64'
          assert result['archive'].startswith('https://nexus-playground.pleos.ai/repository/raw-releases/connect-avd/')
          pathlib.Path(os.environ['EVIDENCE'], 'official-image-metadata.json').write_text(json.dumps(result, indent=2))
          directory = pathlib.Path.home() / '.android'
          directory.mkdir(exist_ok=True)
          (directory / 'repositories.cfg').write_text('count=1\nsrc00=' + url + '\ndisp00=Pleos Connect official image\nenabled00=true\n')
          print('Official API 34 x86_64 metadata verified; archive bytes:', result['archiveBytes'])
          PY
          # sdkmanager 16.0 supports this extra repository provider directly.
          # It supplements (never replaces) the built-in Google repositories.
          printf 'sdkmanager extra provider: %s\n' "$PLEOS_REPOSITORY" | tee "$EVIDENCE/sdk-extra-provider.txt"
          sdkmanager --version >> "$EVIDENCE/sdk-extra-provider.txt" 2>&1
          SDKMANAGER_OPTS="-Dandroid.sdk.custom.url=$PLEOS_REPOSITORY" sdkmanager --list > "$EVIDENCE/sdk-packages.log" 2>&1
          if ! grep -F "$PLEOS_IMAGE" "$EVIDENCE/sdk-packages.log"; then
            tail -n 30 "$EVIDENCE/sdk-packages.log"
            echo "::error::Official Pleos image was not discovered via extra provider $PLEOS_REPOSITORY. See sdk-extra-provider.txt and sdk-packages.log; no substitute image will be used."
            exit 1
          fi
      - name: Install or validate licensed Pleos image
        timeout-minutes: 12
        run: |
          # Acceptance is permitted only after the explicit workflow input gate above.
          # sdkmanager performs official archive/checksum validation; no SDK is redistributed.
          set +e
          set +o pipefail
          printf 'sdkmanager extra provider: %s\n' "$PLEOS_REPOSITORY" > "$EVIDENCE/image-install.log"
          yes | SDKMANAGER_OPTS="-Dandroid.sdk.custom.url=$PLEOS_REPOSITORY" sdkmanager "$PLEOS_IMAGE" >> "$EVIDENCE/image-install.log" 2>&1
          result=${PIPESTATUS[1]}
          set -e
          set -o pipefail
          if [ "$result" -ne 0 ]; then
            tail -n 35 "$EVIDENCE/image-install.log"
            echo '::error::Pleos image installation failed; inspect image-install.log (network, disk, license, or SDK compatibility).'
            exit "$result"
          fi
      - name: Create AVD from installed official image
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager list device > "$EVIDENCE/available-device-profiles.txt"
          if ! grep -F '"Pleos_Connect_v2_0"' "$EVIDENCE/available-device-profiles.txt"; then
            echo '::error::Official Pleos_Connect_v2_0 hardware profile is absent. Refusing a generic device substitute.'
            exit 1
          fi
          printf 'no\n' | avdmanager create avd --force --name pleos_ci --package "$PLEOS_IMAGE" --device Pleos_Connect_v2_0 --path "$ANDROID_AVD_HOME/pleos_ci.avd" > "$EVIDENCE/avd-create.log" 2>&1
          avdmanager list avd > "$EVIDENCE/available-avds.txt" 2>&1 || true
          if [ -f "$ANDROID_AVD_HOME/pleos_ci.avd/config.ini" ]; then
            cp "$ANDROID_AVD_HOME/pleos_ci.avd/config.ini" "$EVIDENCE/avd-config.ini" || true
          else
            printf 'Config diagnostic unavailable at %s; see available-avds.txt.\n' "$ANDROID_AVD_HOME/pleos_ci.avd/config.ini" > "$EVIDENCE/avd-config-note.txt"
          fi
          if [ ! -e /dev/kvm ]; then
            echo '::error::KVM unavailable on this runner; stopping instead of unbounded software CPU emulation.'
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          emulator -accel-check > "$EVIDENCE/acceleration.txt" 2>&1
      - name: Attempt silent cold boot with software graphics
        timeout-minutes: 11
        run: |
          emulator_cores=$(nproc)
          if [ "$emulator_cores" -gt 4 ]; then emulator_cores=4; fi
          printf '%s\n' "$emulator_cores" > "$EVIDENCE/emulator-cores.txt"
          nohup emulator -avd pleos_ci -no-window -no-audio -no-snapshot \
            -gpu swiftshader -memory 4096 -cores "$emulator_cores" -no-boot-anim -verbose \
            > "$EVIDENCE/emulator.log" 2>&1 < /dev/null &
          echo "$!" > "$EVIDENCE/emulator.pid"
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$(cat "$EVIDENCE/emulator.pid")" 2>/dev/null; then
              echo '::error::Pleos emulator exited before boot. Software GPU support is unverified; see emulator.log.'
              exit 1
            fi
            boot=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$boot" = 1 ]; then
              printf '1\n' > "$EVIDENCE/sys.boot_completed.txt"
              timeout 10 adb shell pm list libraries > "$EVIDENCE/android-shared-libraries.txt" 2>&1 || true
              timeout 10 adb shell printenv BOOTCLASSPATH > "$EVIDENCE/android-bootclasspath.txt" 2>&1 || true
              exit 0
            fi
            sleep 5
          done
          echo '::error::Pleos cold boot did not complete within 10 minutes. This is not a verified runtime.'
          exit 1
      - name: Wait for the real foreground user and cold-boot home setup
        timeout-minutes: 4
        run: |
          # Retain logs before installing/launching the app; a tail-only dump lost
          # the first launch when the Pleos home later started its default apps.
          nohup adb logcat -b main -b system -b crash -v threadtime > "$EVIDENCE/logcat-continuous.txt" 2>&1 < /dev/null &
          echo "$!" > "$EVIDENCE/logcat.pid"
          settle_started=$SECONDS
          settle_deadline=$((SECONDS + 150))
          stable_since=$SECONDS
          previous_user=''
          printf 'elapsedSeconds\tcurrentUser\tuserState\tbootAnimation\n' > "$EVIDENCE/user-readiness.tsv"
          while [ "$SECONDS" -lt "$settle_deadline" ]; do
            active_user=$(timeout 5 adb shell am get-current-user 2>/dev/null | tr -d '\r' || true)
            user_state='unknown'
            if [[ "$active_user" =~ ^[0-9]+$ ]]; then
              # Supported by Android 14 ActivityManagerShellCommand; no user unlock
              # or switch command is issued. Read the actual state only.
              user_state=$(timeout 5 adb shell am get-started-user-state "$active_user" 2>/dev/null | tr -d '\r' || true)
              if [[ "$user_state" != RUNNING_* ]]; then
                timeout 8 adb shell dumpsys user > "$EVIDENCE/user-state-fallback.txt" 2>&1 || true
                user_state=$(python3 - "$EVIDENCE/user-state-fallback.txt" "$active_user" <<'PY'
          import pathlib, re, sys
          selected = False
          for line in pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines():
              user = re.search(r'UserInfo\{(\d+):', line)
              if user:
                  selected = user.group(1) == sys.argv[2]
              if selected:
                  state = re.search(r'\bState:\s*(RUNNING_[A-Z_]+)', line)
                  if state:
                      print(state.group(1))
                      break
          PY
                )
              fi
            fi
            boot_animation=$(timeout 5 adb shell getprop init.svc.bootanim 2>/dev/null | tr -d '\r' || true)
            printf '%s\t%s\t%s\t%s\n' "$((SECONDS-settle_started))" "$active_user" "$user_state" "$boot_animation" >> "$EVIDENCE/user-readiness.tsv"
            if [ "$active_user" != "$previous_user" ] || [ "$user_state" != RUNNING_UNLOCKED ] || { [ -n "$boot_animation" ] && [ "$boot_animation" != stopped ]; }; then
              stable_since=$SECONDS
            fi
            previous_user="$active_user"
            # The recorded first cold boot launched default home apps well after
            # sys.boot_completed. Allow 60 seconds for that real OS initialization,
            # then require 15 seconds of stable, observed unlocked-user state.
            if [[ "$active_user" =~ ^[0-9]+$ ]] && [ "$user_state" = RUNNING_UNLOCKED ] && { [ -z "$boot_animation" ] || [ "$boot_animation" = stopped ]; } && [ "$((SECONDS-settle_started))" -ge 60 ] && [ "$((SECONDS-stable_since))" -ge 15 ]; then
              printf 'PLEOS_ACTIVE_USER=%s\n' "$active_user" >> "$GITHUB_ENV"
              printf '%s\n' "$active_user" > "$EVIDENCE/active-user.txt"
              timeout 10 adb shell dumpsys activity activities > "$EVIDENCE/home-after-settle.txt" 2>&1 || true
              timeout 10 adb shell dumpsys user > "$EVIDENCE/users-after-settle.txt" 2>&1 || true
              exit 0
            fi
            sleep 3
          done
          echo '::error::The real foreground user did not reach a stable unlocked state. No user/vehicle state was changed; see user-readiness.tsv.'
          exit 1
      - name: Install APK and capture native app startup (silent video)
        id: capture
        timeout-minutes: 5
        run: |
          # Grant declared runtime permissions on this disposable emulator only.
          # This does not bypass signature permissions or access the local Mac mic.
          adb install --user "$PLEOS_ACTIVE_USER" -r -g pleos-demo/android/app/build/outputs/apk/debug/app-debug.apk > "$EVIDENCE/apk-install.log" 2>&1
          app_resumed=false
          for attempt in 1 2 3; do
            current_user=$(adb shell am get-current-user | tr -d '\r')
            printf 'expected=%s actual=%s\n' "$PLEOS_ACTIVE_USER" "$current_user" > "$EVIDENCE/launch-attempt-$attempt-user.txt"
            if [ "$current_user" != "$PLEOS_ACTIVE_USER" ]; then
              echo '::error::Foreground Android user changed after settling; refusing to launch into a different user.'
              break
            fi
            timeout 30 adb shell am start -W --user "$PLEOS_ACTIVE_USER" \
              -a android.intent.action.MAIN -c android.intent.category.LAUNCHER \
              -n "$APP_ID/.MainActivity" > "$EVIDENCE/launch-attempt-$attempt.txt" 2>&1 || true
            resumed_samples=0
            for sample in 1 2 3 4 5 6 7 8; do
              timeout 8 adb shell dumpsys activity activities > "$EVIDENCE/launch-attempt-$attempt-activity.txt" 2>&1 || true
              app_pid=$(timeout 5 adb shell pidof "$APP_ID" 2>/dev/null | tr -d '\r' || true)
              if [ -n "$app_pid" ] && grep -E '(topResumedActivity|mResumedActivity|ResumedActivity|Resumed:).*ai\.projectshu\.musicdiary\.pleosdemo/' "$EVIDENCE/launch-attempt-$attempt-activity.txt" > "$EVIDENCE/launch-attempt-$attempt-resumed.txt"; then
                resumed_samples=$((resumed_samples+1))
              else
                resumed_samples=0
              fi
              if [ "$resumed_samples" -ge 3 ]; then
                app_resumed=true
                break
              fi
              sleep 2
            done
            timeout 10 adb logcat -b crash -d > "$EVIDENCE/launch-attempt-$attempt-crash.txt" 2>&1 || true
            timeout 10 adb shell dumpsys activity exit-info "$APP_ID" > "$EVIDENCE/launch-attempt-$attempt-exit-info.txt" 2>&1 || true
            cp "$EVIDENCE/launch-attempt-$attempt.txt" "$EVIDENCE/app-launch.txt" || true
            if [ "$app_resumed" = true ]; then break; fi
            sleep 5
          done
          if [ "$app_resumed" != true ]; then
            timeout 10 adb exec-out screencap -p > "$EVIDENCE/app-launch-failed-screen.png" 2>/dev/null || true
            echo '::error::The app did not remain RESUMED with a live process after three launches. Crash and launch evidence is retained.'
            exit 1
          fi
          # Begin capture only after the actual app is stably resumed, avoiding
          # the initial Pleos home/display reconfiguration seen in the first run.
          adb shell screenrecord --size 1280x720 --bit-rate 4000000 --time-limit 35 /sdcard/pleos-startup.mp4 > "$EVIDENCE/screenrecord.log" 2>&1 &
          recorder=$!
          sleep 5
          capture_failed=false
          if ! adb exec-out screencap -p > "$EVIDENCE/app-screen.png"; then
            capture_failed=true
            echo '::warning::Screenshot failed; native SDK verification will still run.'
          fi
          adb shell dumpsys activity activities > "$EVIDENCE/activity.txt"
          adb shell dumpsys activity services "$APP_ID" > "$EVIDENCE/app-services.txt"
          adb shell service list > "$EVIDENCE/system-services.txt"
          adb shell dumpsys package "$APP_ID" > "$EVIDENCE/app-package.txt"
          adb shell dumpsys package ai.pleos.playground.caas > "$EVIDENCE/caas-package.txt" 2>&1 || true
          adb shell dumpsys package ai.pleos.playground.service.vehicle > "$EVIDENCE/vehicle-service-package.txt" 2>&1 || true
          adb shell dumpsys webviewupdate > "$EVIDENCE/webview-provider.txt" 2>&1 || true
          timeout 25 adb shell uiautomator dump /sdcard/pleos-window.xml > "$EVIDENCE/ui-dump.log" 2>&1 || true
          adb pull /sdcard/pleos-window.xml "$EVIDENCE/app-window.xml" || true
          wait "$recorder" || true
          if ! adb pull /sdcard/pleos-startup.mp4 "$EVIDENCE/pleos-native-startup-silent.mp4"; then
            capture_failed=true
            echo '::warning::Silent video capture failed; native SDK verification will still run.'
          fi
          if [ ! -s "$EVIDENCE/app-screen.png" ] || [ ! -s "$EVIDENCE/pleos-native-startup-silent.mp4" ]; then
            capture_failed=true
          fi
          printf '{"captureFailed":%s,"audioRecorded":false,"visualReviewRequired":true}\n' "$capture_failed" > "$EVIDENCE/capture-status.json"
          grep -F "$APP_ID/.MainActivity" "$EVIDENCE/activity.txt" > "$EVIDENCE/activity-match.txt"
      - name: Read real native SDK readiness through debug WebView
        id: sdk_readiness
        timeout-minutes: 3
        run: |
          test "$(adb shell am get-current-user | tr -d '\r')" = "$PLEOS_ACTIVE_USER"
          app_pid=$(adb shell pidof "$APP_ID" | tr -d '\r')
          test -n "$app_pid"
          adb forward tcp:9222 "localabstract:webview_devtools_remote_$app_pid"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dest = process.env.EVIDENCE;
          const pages = await fetch('http://127.0.0.1:9222/json/list').then(r => r.json());
          const page = pages.find(p => p.url?.startsWith('https://appassets.androidplatform.net/assets/'));
          if (!page?.webSocketDebuggerUrl) throw new Error('Local native WebView not inspectable; SDK readiness remains unverified.');
          const evaluate = expression => new Promise((resolve, reject) => {
            const ws = new WebSocket(page.webSocketDebuggerUrl);
            const finish = (error, value) => {
              clearTimeout(timer); ws.close();
              if (error) reject(error); else resolve(value);
            };
            const timer = setTimeout(() => finish(new Error('SDK inspector request timed out')), 10000);
            ws.addEventListener('error', () => finish(new Error('WebView inspector connection failed')));
            ws.addEventListener('open', () => ws.send(JSON.stringify({id: 1, method: 'Runtime.evaluate', params: {expression, returnByValue: true}})));
            ws.addEventListener('message', e => {
              try {
                const msg = JSON.parse(e.data);
                if (msg.id !== 1) return;
                if (msg.error || msg.result?.exceptionDetails) finish(new Error('Native inspector request failed'));
                else finish(null, JSON.parse(msg.result.result.value));
              } catch (error) { finish(error); }
            });
          });
          const readExpression = 'JSON.stringify({title:document.title,url:location.href,bridge:typeof window.PleosNative!=="undefined",status:window.PleosNative?JSON.parse(PleosNative.getStatus()):null})';
          const isReady = r => Boolean(r?.bridge && r.status?.transport === 'pleos-native' && r.status.ttsReady === true && r.status.sttReady === true && r.status.vehicleConnected === true && typeof r.status.uxRestricted === 'boolean');
          const samples = [];
          const started = Date.now(), deadline = started + 60000;
          let result = null, refreshedVehicle = false;
          do {
            try {
              result = await evaluate(readExpression);
              samples.push({elapsedMs: Date.now() - started, result});
              if (isReady(result)) break;
              const s = result?.status;
              if (!refreshedVehicle && result?.bridge && s?.transport === 'pleos-native' && s.ttsReady === true && s.sttReady === true && s.vehicleConnected === false && typeof s.uxRestricted === 'boolean') {
                // One actual SDK re-query; never assign or replace SDK/vehicle state.
                refreshedVehicle = true;
                await evaluate('JSON.stringify({requested:(PleosNative.refreshVehicle(),true)})');
                samples.push({elapsedMs: Date.now() - started, action: 'real refreshVehicle requested once'});
              }
            } catch (error) {
              samples.push({elapsedMs: Date.now() - started, error: String(error)});
            }
            fs.writeFileSync(`${dest}/native-sdk-status-samples.json`, JSON.stringify(samples, null, 2));
            if (Date.now() >= deadline) break;
            await new Promise(resolve => setTimeout(resolve, Math.min(2000, deadline - Date.now())));
          } while (Date.now() < deadline);
          fs.writeFileSync(`${dest}/native-sdk-status-samples.json`, JSON.stringify(samples, null, 2));
          fs.writeFileSync(`${dest}/native-sdk-status.json`, JSON.stringify(result, null, 2));
          const ready = isReady(result);
          fs.writeFileSync(`${dest}/verification.json`, JSON.stringify({bootCompleted:true,nativeStatusRead:result!==null,sdkReady:ready,refreshedVehicle,visualReviewRequired:true,audioVerified:false,microphoneVerified:false,fullConversationVerified:false}, null, 2));
          if (!ready) throw new Error('App launched but one or more Pleos services are not ready. Inspect native-sdk-status.json; runtime integration is partial.');
          JS
      - name: Record real UI journey with example answers (silent)
        if: success() && steps.sdk_readiness.outcome == 'success'
        timeout-minutes: 9
        run: |
          # Native instrumentation also requires actual SDK readiness and unrestricted
          # AAOS UX before every action. No JS, SDK, or VHAL values are substituted.
          test "$(adb shell am get-current-user | tr -d '\r')" = "$PLEOS_ACTIVE_USER"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version > "$EVIDENCE/ffmpeg-version.txt"
          adb install --user "$PLEOS_ACTIVE_USER" -r pleos-demo/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > "$EVIDENCE/test-apk-install.log"
          # Android screenrecord limits a file to 180 seconds. Keep the actual
          # recordings as two sequential segments; concatenate their frames only.
          (
            for segment in 1 2; do
              if [ -e "$EVIDENCE/journey-recording-stop" ]; then break; fi
              printf '%s segment=%s start\n' "$(date -u +%FT%TZ)" "$segment" >> "$EVIDENCE/journey-recording-timeline.txt"
              adb shell screenrecord --size 1280x720 --bit-rate 4000000 --time-limit 180 \
                "/sdcard/pleos-journey-$segment.mp4" > "$EVIDENCE/journey-screenrecord-$segment.log" 2>&1 || true
              printf '%s segment=%s end\n' "$(date -u +%FT%TZ)" "$segment" >> "$EVIDENCE/journey-recording-timeline.txt"
            done
          ) &
          recorder=$!
          instrument_result=0
          instrument_started=$(date +%s)
          timeout 300 adb shell am instrument --user "$PLEOS_ACTIVE_USER" -w -r \
            -e allowPleosJourney true \
            -e class ai.projectshu.musicdiary.pleosdemo.PleosJourneyTest \
            ai.projectshu.musicdiary.pleosdemo.test/androidx.test.runner.AndroidJUnitRunner \
            > "$EVIDENCE/journey-instrumentation.log" 2>&1 || instrument_result=$?
          instrument_elapsed=$(($(date +%s)-instrument_started))
          touch "$EVIDENCE/journey-recording-stop"
          # Repeated SIGINT also covers a segment boundary while the recorder
          # moves to its next real file. No synthetic frames fill that boundary.
          for stop_attempt in 1 2 3; do
            adb shell pkill -2 screenrecord || true
            sleep 1
          done
          wait "$recorder" || true
          : > "$EVIDENCE/journey-segments.txt"
          for segment in 1 2; do
            clip="$EVIDENCE/pleos-native-journey-segment-$segment.mp4"
            if timeout 30 adb pull "/sdcard/pleos-journey-$segment.mp4" "$clip" > "$EVIDENCE/journey-video-pull-$segment.log" 2>&1 && [ -s "$clip" ]; then
              printf "file '%s'\n" "$clip" >> "$EVIDENCE/journey-segments.txt"
            fi
          done
          if [ -s "$EVIDENCE/journey-segments.txt" ]; then
            ffmpeg -nostdin -y -f concat -safe 0 -i "$EVIDENCE/journey-segments.txt" \
              -c copy -an -movflags +faststart "$EVIDENCE/pleos-native-journey-silent.mp4" > "$EVIDENCE/journey-concat.log" 2>&1 || true
            ffprobe -v error -show_format -show_streams -of json "$EVIDENCE/pleos-native-journey-silent.mp4" > "$EVIDENCE/journey-video-metadata.json" 2>&1 || true
          fi
          if [ "$instrument_result" -ne 0 ]; then
            adb shell am force-stop --user "$PLEOS_ACTIVE_USER" "$APP_ID" || true
          fi
          # Android 14 run-as syntax is PACKAGE --user ID COMMAND. Access only
          # this debuggable app's own files; do not read another user's storage.
          timeout 30 adb exec-out run-as "$APP_ID" --user "$PLEOS_ACTIVE_USER" \
            tar -C files/journey-evidence -cf - . > "$EVIDENCE/journey-evidence.tar" 2> "$EVIDENCE/journey-evidence-pull.log" || true
          python3 - <<'PY' > "$EVIDENCE/journey-extract.log" 2>&1 || true
          import json, os, pathlib, tarfile
          evidence = pathlib.Path(os.environ['EVIDENCE'])
          target = evidence / 'journey-evidence'
          target.mkdir(exist_ok=True)
          try:
              with tarfile.open(evidence / 'journey-evidence.tar', 'r:*') as archive:
                  for member in archive.getmembers():
                      path = pathlib.PurePosixPath(member.name)
                      if path.is_absolute() or '..' in path.parts:
                          raise ValueError('Unsafe archive path: ' + member.name)
                      if member.isdir():
                          continue
                      if not member.isfile() or path.suffix not in {'.json', '.png', '.xml'}:
                          raise ValueError('Unexpected archive member: ' + member.name)
                      destination = target.joinpath(*path.parts)
                      if not destination.resolve().is_relative_to(target.resolve()):
                          raise ValueError('Archive member escaped evidence directory')
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with archive.extractfile(member) as source, destination.open('wb') as output:
                          import shutil
                          shutil.copyfileobj(source, output)
              print('Extracted only regular JSON, PNG and XML files from this debug app.')
          except Exception as error:
              (evidence / 'journey-extraction-error.json').write_text(json.dumps({'error': str(error)}))
              raise
          PY
          INSTRUMENT_RESULT="$instrument_result" INSTRUMENT_ELAPSED="$instrument_elapsed" python3 - <<'PY'
          import json, os, pathlib
          evidence = pathlib.Path(os.environ['EVIDENCE'])
          result_path = evidence / 'journey-evidence' / 'result.json'
          try:
              result = json.loads(result_path.read_text()) if result_path.exists() else {}
          except (ValueError, OSError) as error:
              result = {'passed': False, 'error': 'Could not read test result: ' + str(error)}
          video = evidence / 'pleos-native-journey-silent.mp4'
          log = (evidence / 'journey-instrumentation.log').read_text(errors='replace')
          process_ok = os.environ['INSTRUMENT_RESULT'] == '0'
          test_ok = result.get('passed') is True and 'FAILURES!!!' not in log and 'INSTRUMENTATION_FAILED' not in log
          try:
              metadata = json.loads((evidence / 'journey-video-metadata.json').read_text())
          except (ValueError, OSError):
              metadata = {}
          video_exists = video.is_file() and video.stat().st_size > 0 and any(stream.get('codec_type') == 'video' for stream in metadata.get('streams', []))
          summary = {'instrumentationExit': int(os.environ['INSTRUMENT_RESULT']), 'testPassed': test_ok,
                     'instrumentationElapsedSeconds': int(os.environ['INSTRUMENT_ELAPSED']),
                     'recordedDurationSeconds': metadata.get('format', {}).get('duration'),
                     'testError': result.get('error', None if result_path.exists() else 'No result.json collected; inspect instrumentation and extraction logs.'),
                     'videoCaptured': video_exists, 'passed': process_ok and test_ok and video_exists,
                     'interaction': 'real accessibility button taps with example answers',
                     'visualReviewRequired': True, 'acousticOutputVerified': False, 'microphoneRecognitionVerified': False}
          (evidence / 'journey-verification.json').write_text(json.dumps(summary, indent=2))
          if not summary['passed']:
              raise SystemExit('Real UI journey did not pass or capture is incomplete. Evidence preserved; inspect journey-verification.json, result.json, and instrumentation log.')
          print('Real accessibility journey passed and silent video exists; manual visual review remains required.')
          PY
      - name: Confirm captures separately from SDK readiness
        if: always() && steps.capture.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          data = json.loads(pathlib.Path(os.environ['EVIDENCE'], 'capture-status.json').read_text())
          if data['captureFailed']:
              raise SystemExit('Capture incomplete. SDK readiness results are preserved separately; no complete demo video is claimed.')
          print('Capture files exist. Manual visual review is still required; audio and full conversation are unverified.')
          PY
      - name: Collect diagnostics and stop emulator
        if: always() && inputs.acknowledge_pleos_license && steps.prepare.outcome == 'success'
        run: |
          mkdir -p "$EVIDENCE"
          if command -v adb >/dev/null 2>&1; then
            timeout 15 adb logcat -d -t 10000 > "$EVIDENCE/logcat.txt" 2>&1 || true
            timeout 10 adb logcat -b crash -d > "$EVIDENCE/logcat-crash.txt" 2>&1 || true
            timeout 10 adb shell dumpsys activity exit-info "$APP_ID" > "$EVIDENCE/app-exit-info.txt" 2>&1 || true
            timeout 10 adb shell am get-current-user > "$EVIDENCE/final-current-user.txt" 2>&1 || true
            timeout 10 adb shell dumpsys user > "$EVIDENCE/final-user-state.txt" 2>&1 || true
            timeout 10 adb shell getprop > "$EVIDENCE/device-properties.txt" 2>&1 || true
            if [ -f "$EVIDENCE/logcat.pid" ]; then
              kill "$(cat "$EVIDENCE/logcat.pid")" 2>/dev/null || true
            fi
            timeout 10 adb emu kill || true
          fi
          df -h > "$EVIDENCE/disk-after.txt"
          echo '### Pleos emulator experiment' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect native-sdk-status.json and app-screen.png. ADB/device visibility alone is not SDK success.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Startup and UI journey captures are silent. Check journey-verification.json before claiming a completed UI journey. Audio, microphone and real-vehicle behavior remain unverified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics and silent captures only
        if: always() && inputs.acknowledge_pleos_license
        uses: actions/upload-artifact@v4
        with:
          name: pleos-emulator-evidence-${{ github.run_number }}
          path: pleos-evidence/
          if-no-files-found: warn
          retention-days: 7
